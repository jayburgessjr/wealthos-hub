<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <rect width="64" height="64" rx="14" fill="url(#bg-gradient)" opacity="0.4"/>
  <!-- Chart line -->
  <polyline
    points="8,44 20,36 30,40 42,20 56,14"
    stroke="#00cc73"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.5"
  />
  <!-- W lettermark -->
  <text
    x="32"
    y="48"
    font-family="Arial Black, Arial, sans-serif"
    font-size="34"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="auto"
    letter-spacing="-1"
  >W</text>
  <!-- Green dot accent -->
  <circle cx="54" cy="14" r="4" fill="#00cc73"/>
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00cc73"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
</svg>
