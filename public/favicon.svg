<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>

  <!-- Leaf shape -->
  <path
    d="M32 10
       C44 10 54 20 54 34
       C54 46 44 54 32 54
       C20 54 10 46 10 34
       C10 20 20 10 32 10 Z"
    fill="none"
  />
  <!-- Leaf: teardrop pointing up-right -->
  <path
    d="M34 52
       C34 52 14 46 12 26
       C12 26 28 10 48 14
       C48 14 52 34 34 52 Z"
    fill="#00cc73"
    opacity="0.15"
  />
  <path
    d="M34 52
       C34 52 14 46 12 26
       C12 26 28 10 48 14
       C48 14 52 34 34 52 Z"
    stroke="#00cc73"
    stroke-width="2.5"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Center vein -->
  <line x1="34" y1="52" x2="30" y2="18" stroke="#00cc73" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Side veins -->
  <line x1="27" y1="38" x2="38" y2="32" stroke="#00cc73" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="24" y1="30" x2="38" y2="24" stroke="#00cc73" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
